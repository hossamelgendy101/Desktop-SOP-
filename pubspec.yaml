name: pos_system
description: A complete offline POS system for retail businesses
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  provider: ^6.1.1

  # Database
  sqflite_common_ffi: ^2.3.0
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1

  # UI
  google_fonts: ^6.1.0
  fl_chart: ^0.65.0
  data_table_2: ^2.5.9
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0

  # Printing & PDF
  pdf: ^3.10.4
  printing: ^5.11.0
  esc_pos_utils_plus: ^2.0.1+6
  image: ^4.1.3

  # Barcode & QR
  barcode_widget: ^2.0.4
  qr_flutter: ^4.1.0

  # File Operations
  file_picker: ^6.1.1
  share_plus: ^7.2.1
  archive: ^3.4.9
  csv: ^5.1.1
  excel: ^4.0.2

  # Utils
  intl: ^0.19.0
  uuid: ^4.2.1
  crypto: ^3.0.3
  encrypt: ^5.0.1
  shared_preferences: ^2.2.2
  permission_handler: ^11.0.1
  window_manager: ^0.3.7
  screen_retriever: ^0.1.9
  hotkey_manager: 0.2.3

  # Notifications
  flutter_local_notifications: ^16.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/i18n/
